<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>IndoChat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
  :root{
    --bg:#000;--bg-2:#0a0a0a;--bg-3:#161616;--bg-4:#1f1f1f;--bg-5:#262626;
    --accent:#0095f6;--accent-2:#1877f2;
    --text:#fafafa;--text-2:#a8a8a8;--text-3:#737373;
    --border:#262626;--danger:#ed4956;--warn:#f5b400;--ok:#2ecc71;--purple:#a855f7;
    --shadow:0 4px 24px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;font-family:'Inter',-apple-system,sans-serif}
  body{background:var(--bg);color:var(--text);overflow:hidden;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit}
  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
  img{max-width:100%}

  /* AUTH */
  #authScreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
  .auth-card{width:100%;max-width:360px}
  .auth-logo{text-align:center;font-size:32px;font-weight:800;margin-bottom:32px;font-family:'Inter',sans-serif}
  .field{margin-bottom:10px}
  .field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px;font-weight:500}
  .field .input-wrap{position:relative}
  .field .input-wrap .prefix{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-2);font-size:14px;pointer-events:none}
  .field input,.field textarea,.field select{width:100%;padding:12px;background:var(--bg-3);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;outline:none;transition:.15s}
  .field input.with-prefix{padding-left:40px}
  .field input:focus,.field textarea:focus{border-color:var(--text-3);background:var(--bg-4)}
  .field textarea{resize:vertical;min-height:80px}
  .field .err{color:var(--danger);font-size:11px;margin-top:4px;min-height:14px}
  .field .hint{color:var(--text-3);font-size:11px;margin-top:4px}
  .btn{padding:12px;border-radius:10px;font-weight:600;font-size:14px;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;cursor:pointer}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-2)}
  .btn-primary:disabled{background:var(--bg-5);color:var(--text-3);cursor:not-allowed}
  .btn-ghost{background:var(--bg-3);color:var(--text);border:1px solid var(--border)}
  .btn-ghost:hover{background:var(--bg-4)}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-ok{background:var(--ok);color:#fff}
  .btn-text{background:transparent;color:var(--accent);font-size:13px;font-weight:600;padding:8px;cursor:pointer}
  .switch-mode{text-align:center;margin-top:16px;color:var(--text-2);font-size:13px}
  .switch-mode a{color:var(--accent);cursor:pointer;font-weight:600}

  /* CHAT - mobile first */
  #chatApp{display:none;height:100vh;height:100dvh;width:100vw}
  #chatApp.active{display:grid;grid-template-columns:1fr}
  @media(min-width:769px){#chatApp.active{grid-template-columns:360px 1fr}}
  .sidebar{background:var(--bg-2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
  .sidebar.hide-mobile{display:none}
  .sidebar-header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
  .sidebar-header .me{display:flex;align-items:center;gap:10px;cursor:pointer}
  .avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:15px;flex-shrink:0;overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .me-info .name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:4px}
  .verified-badge{display:inline-flex;width:16px;height:16px;align-items:center;justify-content:center}
  .verified-badge svg{width:14px;height:14px}
  .me-info .status{font-size:11px;color:var(--text-2)}
  .header-actions{display:flex;gap:4px}
  .icon-btn{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-2);transition:.15s;cursor:pointer;position:relative}
  .icon-btn:hover{background:var(--bg-3);color:var(--text)}
  .search-bar{padding:8px 12px;border-bottom:1px solid var(--border);position:relative}
  .search-wrap{background:var(--bg-3);border-radius:8px;display:flex;align-items:center;padding:0 10px}
  .search-wrap input{background:transparent;border:none;outline:none;padding:9px 8px;color:var(--text);font-size:13px;flex:1}
  .search-results{position:absolute;top:48px;left:12px;right:12px;background:var(--bg-3);border:1px solid var(--border);border-radius:8px;max-height:280px;overflow-y:auto;box-shadow:var(--shadow);z-index:5;display:none}
  .search-results.active{display:block}
  .search-result-item{padding:10px 12px;display:flex;align-items:center;gap:10px;cursor:pointer}
  .search-result-item:hover{background:var(--bg-4)}
  .sr-name{font-size:13px;font-weight:500;flex:1;display:flex;align-items:center;gap:4px}
  .sr-add{background:var(--accent);color:#fff;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:600}
  .chat-list{flex:1;overflow-y:auto}
  .chat-list-item{padding:12px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;border-bottom:1px solid var(--border)}
  .chat-list-item:hover{background:var(--bg-3)}
  .cl-info{flex:1;min-width:0}
  .cl-name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:4px}
  .cl-last{font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .empty-list{padding:40px 20px;text-align:center;color:var(--text-3);font-size:13px;line-height:1.7}

  .chat-area{display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
  .chat-area.hide-mobile{display:none}
  .chat-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .ch-info{flex:1;min-width:0}
  .ch-info .name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:4px}
  .ch-info .status{font-size:11px;color:var(--text-2)}
  .messages{flex:1;overflow-y:auto;padding:16px 12px;-webkit-overflow-scrolling:touch}
  .msg{display:flex;margin-bottom:4px;animation:msgIn .15s ease}
  @keyframes msgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  .msg.sent{justify-content:flex-end}
  .msg .bubble{max-width:75%;padding:8px 12px;border-radius:18px;font-size:14px;line-height:1.4;word-wrap:break-word}
  .msg.sent .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .msg.received .bubble{background:var(--bg-3);color:var(--text);border-bottom-left-radius:4px}
  .msg .meta{font-size:9px;color:var(--text-3);margin-top:2px;text-align:right}
  .msg.sent .meta{color:rgba(255,255,255,.5)}
  .day-wrap{text-align:center;margin:12px 0}
  .msg-day{display:inline-block;color:var(--text-3);font-size:10px;padding:3px 10px;background:var(--bg-3);border-radius:6px}
  .composer{padding:8px 12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px}
  .composer input{flex:1;background:var(--bg-3);border:none;border-radius:22px;padding:10px 14px;color:var(--text);font-size:14px;outline:none}
  .send-btn{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
  .send-btn:disabled{background:var(--bg-5)}
  .no-chat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-2);gap:14px;padding:20px;text-align:center}
  .back-btn{display:none;width:36px;height:36px;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
  @media(max-width:768px){.back-btn{display:flex}}

  /* OVERLAYS */
  .overlay{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.active{display:flex;animation:fadeIn .2s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .overlay-bg{background:rgba(0,0,0,.95);backdrop-filter:blur(20px)}
  .ig-screen{width:100%;max-width:380px;text-align:center;animation:slideUp .3s ease}
  @keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .ig-icon{width:80px;height:80px;border-radius:50%;margin:0 auto 24px;display:flex;align-items:center;justify-content:center;position:relative}
  .ig-icon.warn{background:rgba(245,180,0,.1);color:var(--warn)}
  .ig-icon.danger{background:rgba(237,73,86,.1);color:var(--danger)}
  .ig-icon.ok{background:rgba(46,204,113,.1);color:var(--ok)}
  .ig-icon.info{background:rgba(0,149,246,.1);color:var(--accent)}
  .ig-icon::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid currentColor;opacity:.15}
  .ig-icon.danger::after{border-style:dashed;animation:spin 12s linear infinite}
  .ig-icon.ok .pulse{position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--ok);opacity:.3;animation:pulseRing 2s ease-out infinite}
  @keyframes pulseRing{0%{transform:scale(1);opacity:.4}100%{transform:scale(1.4);opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ig-icon svg{width:40px;height:40px}
  .ig-title{font-size:22px;font-weight:700;margin-bottom:8px}
  .ig-desc{font-size:14px;color:var(--text-2);line-height:1.6;margin-bottom:24px}
  .ig-reason{background:var(--bg-3);border-radius:12px;padding:14px;margin-bottom:20px;text-align:left}
  .ig-reason .lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-3);margin-bottom:6px}
  .ig-reason.warn .lbl{color:var(--warn)}
  .ig-reason.danger .lbl{color:var(--danger)}
  .ig-reason.ok .lbl{color:var(--ok)}
  .ig-reason .txt{font-size:13px;color:var(--text);line-height:1.5}
  .ig-info{font-size:12px;color:var(--text-3);margin-bottom:24px;line-height:1.8}
  .ig-info span{color:var(--text-2)}
  .ig-actions{display:flex;flex-direction:column;gap:8px}
  .ig-actions .btn{width:100%;padding:13px;font-size:14px}
  .ig-note{font-size:11px;color:var(--text-3);margin-top:16px}

  /* MODAL */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);z-index:1100;display:none;align-items:center;justify-content:center;padding:16px}
  .modal.active{display:flex;animation:fadeIn .2s ease}
  .modal-card{width:100%;max-width:440px;background:var(--bg-2);border:1px solid var(--border);border-radius:16px;overflow:hidden;animation:slideUp .25s ease;max-height:90vh;display:flex;flex-direction:column}
  .mc-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .mc-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .mc-icon.info{background:rgba(0,149,246,.15);color:var(--accent)}
  .mc-icon.warn{background:rgba(245,180,0,.15);color:var(--warn)}
  .mc-icon.danger{background:rgba(237,73,86,.15);color:var(--danger)}
  .mc-icon.ok{background:rgba(46,204,113,.15);color:var(--ok)}
  .mc-title{font-weight:700;font-size:15px}
  .mc-subtitle{font-size:11px;color:var(--text-2);margin-top:2px}
  .mc-body{padding:18px 20px;overflow-y:auto;flex:1}
  .mc-actions{padding:0 20px 16px;display:flex;gap:8px}
  .mc-actions .btn{flex:1}

  /* Wizard */
  .wiz-progress{display:flex;align-items:center;gap:6px;margin-bottom:16px}
  .wiz-num{width:26px;height:26px;border-radius:50%;background:var(--bg-5);color:var(--text-2);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .wiz-num.active{background:var(--accent);color:#fff}
  .wiz-num.done{background:var(--ok);color:#fff}
  .wiz-line{flex:1;height:2px;background:var(--bg-5);border-radius:1px}
  .wiz-line.done{background:var(--ok)}

  /* Captcha */
  .captcha-canvas{background:repeating-linear-gradient(45deg,#262626,#262626 8px,#1f1f1f 8px,#1f1f1f 16px);border-radius:8px;padding:14px;margin:0 auto 10px;font-family:monospace;font-size:28px;font-weight:700;letter-spacing:6px;color:#fafafa;user-select:none;display:inline-block}
  .captcha-canvas span{display:inline-block;transform:skew(-6deg)}
  .captcha-canvas span:nth-child(odd){transform:skew(6deg) translateY(2px)}

  /* Face verification */
  .face-wrap{position:relative;width:200px;height:200px;margin:0 auto 12px;border-radius:50%;overflow:hidden;background:#000;border:3px solid var(--accent)}
  .face-wrap video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  .face-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .face-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;border-radius:50%}
  .face-flash.flashing{animation:flash .5s ease-out}
  @keyframes flash{0%{opacity:0}20%{opacity:.9}100%{opacity:0}}
  .face-loading{position:absolute;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--text);font-size:12px;text-align:center;padding:16px;border-radius:50%}
  .face-loading .spinner{width:32px;height:32px;border:3px solid var(--bg-5);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  .dir-arrow{font-size:40px;margin:6px 0;animation:pulseArrow 1.2s infinite ease-in-out}
  @keyframes pulseArrow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.15);opacity:.7}}
  .dir-text{font-size:14px;font-weight:600;margin-bottom:10px}
  .dir-steps{display:flex;justify-content:center;gap:6px;margin-bottom:10px}
  .dir-step{width:36px;height:36px;border-radius:8px;background:var(--bg-3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text-2)}
  .dir-step.active{border-color:var(--accent);color:var(--accent)}
  .dir-step.done{background:var(--ok);color:#fff;border-color:var(--ok)}
  .auto-bar{width:100%;height:6px;background:var(--bg-5);border-radius:3px;overflow:hidden;margin:8px 0}
  .auto-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--ok));border-radius:3px;transition:width .12s}
  .auto-fill.complete{background:var(--ok)}
  .motion-status{font-size:11px;color:var(--text-2);min-height:16px}
  .motion-status.ready{color:var(--ok)}
  .motion-status.wrong{color:var(--danger)}
  .motion-status.error{color:var(--danger)}
  .info-banner{background:rgba(0,149,246,.08);border:1px solid rgba(0,149,246,.3);border-radius:8px;padding:10px;margin-bottom:12px;font-size:11px;color:var(--accent);line-height:1.5;text-align:left}

  /* Profile/Settings */
  .profile-section{padding:20px;text-align:center}
  .profile-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:32px;overflow:hidden;cursor:pointer;position:relative}
  .profile-avatar img{width:100%;height:100%;object-fit:cover}
  .profile-avatar .change-overlay{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;opacity:0;transition:.15s}
  .profile-avatar:hover .change-overlay{opacity:1}
  .profile-name{font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
  .profile-meta{font-size:12px;color:var(--text-2);margin-top:4px}
  .menu-item{padding:14px 20px;display:flex;align-items:center;gap:12px;cursor:pointer;border-bottom:1px solid var(--border);transition:.1s}
  .menu-item:hover{background:var(--bg-3)}
  .menu-item svg{width:20px;height:20px;color:var(--text-2)}
  .menu-item .mi-label{flex:1;font-size:14px}
  .menu-item .mi-arrow{color:var(--text-3)}

  /* Toast */
  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--bg-3);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:10px;font-size:13px;z-index:3000;box-shadow:var(--shadow);animation:toastIn .3s ease;max-width:90%;text-align:center}
  @keyframes toastIn{from{transform:translate(-50%,-100%);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  .toast.success{border-left:3px solid var(--ok)}
  .toast.error{border-left:3px solid var(--danger)}
  .toast.info{border-left:3px solid var(--accent)}
  .toast.warn{border-left:3px solid var(--warn)}

  /* Verified badge styles */
  .verified-tick{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin-left:3px}
  .verified-tick svg{width:18px;height:18px}

  @media(max-width:768px){
    .auth-card{max-width:100%}
    .messages{padding:12px 8px}
    .msg .bubble{max-width:80%}
    .ig-screen{max-width:100%}
  }
</style>
</head>
<body>

<!-- AUTH -->
<div id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">IndoChat</div>
    <div id="signupForm">
      <div class="field">
        <label>Username</label>
        <input type="text" id="suUsername" placeholder="e.g. john_doe123" autocomplete="off" />
        <div class="err" id="suUsernameErr"></div>
      </div>
      <div class="field">
        <label>Mobile number</label>
        <div class="input-wrap">
          <span class="prefix">+91</span>
          <input type="tel" id="suMobile" class="with-prefix" placeholder="98765 43210" maxlength="10" />
        </div>
        <div class="err" id="suMobileErr"></div>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="suPassword" placeholder="At least 6 characters" />
        <div class="err" id="suPasswordErr"></div>
      </div>
      <div class="field">
        <label>Confirm password</label>
        <input type="password" id="suConfirm" placeholder="Re-enter password" />
        <div class="err" id="suConfirmErr"></div>
      </div>
      <button class="btn btn-primary" id="signupBtn">Create Account</button>
      <p class="switch-mode">Already have an account? <a id="goToLogin">Sign in</a></p>
    </div>
    <div id="loginForm" style="display:none">
      <div class="field">
        <label>Username</label>
        <input type="text" id="liUsername" placeholder="Your username" autocomplete="off" />
        <div class="err" id="liUsernameErr"></div>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="liPassword" placeholder="Your password" />
        <div class="err" id="liPasswordErr"></div>
      </div>
      <div style="text-align:right;margin:-4px 0 10px">
        <span class="btn-text" id="forgotPasswordLink">Forgot password?</span>
      </div>
      <button class="btn btn-primary" id="loginBtn">Sign In</button>
      <p class="switch-mode">New here? <a id="goToSignup">Create an account</a></p>
    </div>
  </div>
</div>

<!-- CHAT -->
<div id="chatApp">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="me" id="meBtn">
        <div class="avatar" id="meAvatar">U</div>
        <div class="me-info">
          <div class="name" id="meName">user</div>
          <div class="status">online</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="newChatBtn" title="New chat">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        </button>
        <button class="icon-btn" id="logoutBtn" title="Sign out">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
    <div class="search-bar" id="searchBar" style="display:none">
      <div class="search-wrap">

function toast(msg,type='info'){const t=document.createElement('div');t.className='toast '+type;t.textContent=msg;document.getElementById('toastContainer').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},2800);}
function sanitizeUsername(u){return (u||'').toLowerCase().trim().replace(/[^a-z0-9_]/g,'');}
function sanitizeMobile(m){return (m||'').replace(/\D/g,'').slice(-10);}
function hashPassword(pw){let h=0;for(let i=0;i<pw.length;i++){h=((h<<5)-h)+pw.charCodeAt(i);h|=0;}return 'h'+Math.abs(h).toString(36)+'_'+pw.length;}
function escapeHtml(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function formatTime(ts){if(!ts)return '';return new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
function formatDateTime(ts){if(!ts)return '';return new Date(ts).toLocaleString();}
function formatRelative(ts){if(!ts)return '';const d=Date.now()-ts;if(d<60000)return 'just now';if(d<3600000)return Math.floor(d/60000)+'m ago';if(d<86400000)return Math.floor(d/3600000)+'h ago';return new Date(ts).toLocaleDateString();}
function chatIdFor(a,b){return [a,b].sort().join('__');}
function genId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
// Simple message encoding (obfuscation - NOT real encryption but prevents casual DB reading)
function encodeMsg(text){return btoa(unescape(encodeURIComponent(text)));}
function decodeMsg(encoded){try{return decodeURIComponent(escape(atob(encoded)));}catch(e){return encoded;}}

document.getElementById('forgotPasswordLink').onclick=openForgotPassword;

  let step=0;let data={username:'',mobile:'',email:'',reason:''};
  const render=()=>{
    const card=document.getElementById('modalCard');
    card.innerHTML=`<div class="mc-head"><div class="mc-icon info"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div><div><div class="mc-title">Password Recovery</div><div class="mc-subtitle">Step ${step+1} of 3</div></div></div><div class="mc-body"><div class="wiz-progress"><div class="wiz-num ${step>=0?'active':''} ${step>0?'done':''}">1</div><div class="wiz-line ${step>0?'done':''}"></div><div class="wiz-num ${step>0?'active':''} ${step>1?'done':''}">2</div><div class="wiz-line ${step>1?'done':''}"></div><div class="wiz-num ${step>1?'active':''} ${step>2?'done':''}">3</div></div>${step===0?`<div class="field"><label>Username</label><input type="text" id="fpUsername" placeholder="Your exact username" autocomplete="off" value="${escapeHtml(data.username)}" /><div class="hint">The username you sign in with.</div><div class="err" id="fpUsernameErr"></div></div>`:''}${step===1?`<div class="field"><label>Mobile number</label><div class="input-wrap"><span class="prefix">+91</span><input type="tel" id="fpMobile" class="with-prefix" placeholder="98765 43210" maxlength="10" value="${escapeHtml(data.mobile)}" /></div><div class="hint">Must match your registered mobile.</div><div class="err" id="fpMobileErr"></div></div><div class="field"><label>Email for reset link</label><input type="email" id="fpEmail" placeholder="you@example.com" value="${escapeHtml(data.email)}" /><div class="hint">Team sends the one-time link here.</div><div class="err" id="fpEmailErr"></div></div>`:''}${step===2?`<div class="field"><label>What happened? (optional)</label><textarea id="fpReason" rows="3" placeholder="e.g. I forgot my password">${escapeHtml(data.reason)}</textarea></div><div class="ig-reason info"><div class="lbl">How it works</div><div class="txt">Team verifies your mobile, then sends a one-time reset link to your email. Works once, expires in 24h.</div></div>`:''}</div><div class="mc-actions">${step>0?'<button class="btn btn-ghost" id="wizBack">Back</button>':'<button class="btn btn-ghost" id="wizCancel">Cancel</button>'}${step<2?'<button class="btn btn-primary" id="wizNext">Continue</button>':'<button class="btn btn-primary" id="wizSubmit">Submit</button>'}</div>`;

          if(snap.val().resetUsed===true){e.textContent='Reset already used for this account';n.disabled=false;n.textContent='Continue';return;}
          step=1;render();
        }catch(err){e.textContent='Error: '+err.message;n.disabled=false;n.textContent='Continue';}
      }else if(step===1){
        data.mobile=sanitizeMobile(document.getElementById('fpMobile').value);

        const me=document.getElementById('fpMobileErr'),ee=document.getElementById('fpEmailErr');

        if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)){ee.textContent='Enter valid email';return;}
        step=2;render();
      }
    };
    const s=document.getElementById('wizSubmit');
    if(s)s.onclick=async()=>{
      data.reason=document.getElementById('fpReason').value.trim();

      try{
        const reqId=genId('fp_');
        await db.ref('teamRequests/'+reqId).set({type:'forgot_password',username:data.username,mobileEntered:data.mobile,email:data.email,reason:data.reason,status:'pending',createdAt:firebase.database.ServerValue.TIMESTAMP});

// ENTER CHAT
async function enterChat(username){
  currentUser=username;
  currentUserRef=db.ref('users/'+username);
  document.getElementById('authScreen').style.display='none';
  document.getElementById('chatApp').classList.add('active');
  await currentUserRef.child('online').set(true);
  await currentUserRef.child('lastSeen').set(firebase.database.ServerValue.TIMESTAMP);
  window.addEventListener('beforeunload',()=>{currentUserRef.child('online').set(false);currentUserRef.child('lastSeen').set(firebase.database.ServerValue.TIMESTAMP);});
  listenToStatus();
  listenToMyData();
  loadChatList();
  toast('Welcome back','success');
}

function listenToMyData(){
  currentUserRef.on('value',snap=>{
    myData=snap.val()||{};
    document.getElementById('meName').innerHTML=escapeHtml(currentUser)+(myData.verified?VERIFIED_SVG:'');
    const av=document.getElementById('meAvatar');
    if(myData.profilePic){av.innerHTML='<img src="'+myData.profilePic+'" alt=""/>';}
    else{av.textContent=currentUser.charAt(0).toUpperCase();}
  });
}

function listenToStatus(){
  if(statusListener)statusListener.off();
  statusListener=currentUserRef.child('status');
  statusListener.on('value',snap=>{
    const status=snap.val();
    if(!status)return;
    if(status==='suspended')showSuspension();
    else if(status==='reinstated')showReinstated();
    else if(status==='disabled')showDisabled();
    else if(status==='active')closeMainOverlay();
  });
}
function closeMainOverlay(){document.getElementById('mainOverlay').classList.remove('active');}

// NEW CHAT / SEARCH
document.getElementById('newChatBtn').onclick=()=>{
  const sb=document.getElementById('searchBar');
  sb.style.display=sb.style.display==='none'?'block':'none';
  if(sb.style.display==='block')document.getElementById('searchInput').focus();
};
const searchInput=document.getElementById('searchInput');
const searchResults=document.getElementById('searchResults');
let searchDebounce=null;
searchInput.addEventListener('input',()=>{
  clearTimeout(searchDebounce);
  const q=sanitizeUsername(searchInput.value);
  if(q.length<1){searchResults.classList.remove('active');searchResults.innerHTML='';return;}
  searchDebounce=setTimeout(()=>doSearch(q),300);
});
async function doSearch(q){
  const snap=await db.ref('users').orderByKey().limitToFirst(50).get();
  const results=[];
  snap.forEach(child=>{const u=child.key;const d=child.val();if(u!==currentUser&&u.startsWith(q)&&d.status!=='disabled')results.push({username:u,verified:d.verified||false});});
  if(results.length===0){searchResults.innerHTML='<div style="padding:14px;text-align:center;color:var(--text-2);font-size:12px">No users found</div>';}
  else{searchResults.innerHTML=results.map(r=>`<div class="search-result-item" data-username="${escapeHtml(r.username)}"><div class="sr-name">${escapeHtml(r.username)}${r.verified?VERIFIED_SVG:''}</div><div class="sr-add">Add</div></div>`).join('');searchResults.querySelectorAll('.search-result-item').forEach(el=>{el.onclick=async()=>{const u=el.getAttribute('data-username');await addChat(u);searchInput.value='';searchResults.classList.remove('active');document.getElementById('searchBar').style.display='none';};});}
  searchResults.classList.add('active');
}
document.addEventListener('click',e=>{if(!e.target.closest('.search-bar'))searchResults.classList.remove('active');});

async function addChat(peer){
  const cid=chatIdFor(currentUser,peer);
  await db.ref('users/'+currentUser+'/chats/'+peer).set({cid,peer:peer,lastSeen:firebase.database.ServerValue.TIMESTAMP});
  await db.ref('users/'+peer+'/chats/'+currentUser).set({cid,peer:currentUser,lastSeen:firebase.database.ServerValue.TIMESTAMP});
  loadChatList();
  openChat(peer);
}

function loadChatList(){
  if(chatsListener)chatsListener.off();
  chatsListener=db.ref('users/'+currentUser+'/chats');
  chatsListener.on('value',snap=>{chatListCache=snap.val()||{};renderChatList();});
}
function renderChatList(){
  const list=document.getElementById('chatList');
  const entries=Object.values(chatListCache);
  if(entries.length===0){list.innerHTML='<div class="empty-list">No conversations yet.<br/>Tap the message icon to start chatting.</div>';return;}
  list.innerHTML=entries.map(e=>`<div class="chat-list-item" data-peer="${escapeHtml(e.peer)}"><div class="avatar">${escapeHtml(e.peer.charAt(0).toUpperCase())}</div><div class="cl-info"><div class="cl-name">${escapeHtml(e.peer)}</div><div class="cl-last" data-last-for="${escapeHtml(e.peer)}">Tap to open</div></div></div>`).join('');
  entries.forEach(async e=>{
    const msgSnap=await db.ref('chats/'+e.cid+'/messages').orderByKey().limitToLast(1).get();
    let lastText='Tap to open';
    msgSnap.forEach(c=>{const m=c.val();lastText=decodeMsg(m.text||'');});
    const el=list.querySelector(`[data-last-for="${e.peer}"]`);
    if(el)el.textContent=lastText;
  });
  list.querySelectorAll('.chat-list-item').forEach(el=>{el.onclick=()=>openChat(el.getAttribute('data-peer'));});
}

async function openChat(peer){
  activePeer=peer;
  activeChatId=chatIdFor(currentUser,peer);
  document.getElementById('noChatView').style.display='none';
  document.getElementById('chatView').style.display='flex';
  // Get peer data for verified badge
  const peerSnap=await db.ref('users/'+peer).get();
  const peerData=peerSnap.val()||{};
  document.getElementById('peerName').innerHTML=escapeHtml(peer)+(peerData.verified?VERIFIED_SVG:'');
  const pa=document.getElementById('peerAvatar');
  if(peerData.profilePic){pa.innerHTML='<img src="'+peerData.profilePic+'" alt=""/>';}
  else{pa.textContent=peer.charAt(0).toUpperCase();}
  if(window.innerWidth<=768){document.getElementById('sidebar').classList.add('hide-mobile');document.getElementById('chatArea').classList.remove('hide-mobile');}
  db.ref('users/'+peer+'/online').on('value',s=>{const online=s.val();const st=document.getElementById('peerStatus');st.textContent=online?'online':'offline';st.style.color=online?'var(--ok)':'var(--text-2)';});
  if(messagesListener)messagesListener.off();
  const msgsEl=document.getElementById('messages');
  msgsEl.innerHTML='';
  messagesListener=db.ref('chats/'+activeChatId+'/messages').orderByKey();
  messagesListener.on('value',snap=>{
    msgsEl.innerHTML='';
    let lastDay='';
    snap.forEach(child=>{
      const m=child.val();
      const day=new Date(m.timestamp||Date.now()).toDateString();
      if(day!==lastDay){const dw=document.createElement('div');dw.className='day-wrap';const de=document.createElement('div');de.className='msg-day';de.textContent=day===new Date().toDateString()?'Today':day;dw.appendChild(de);msgsEl.appendChild(dw);lastDay=day;}
      const wrap=document.createElement('div');
      wrap.className='msg '+(m.sender===currentUser?'sent':'received');
      wrap.innerHTML=`<div class="bubble">${escapeHtml(decodeMsg(m.text))}<div class="meta">${formatTime(m.timestamp)}</div></div>`;
      msgsEl.appendChild(wrap);
    });
    msgsEl.scrollTop=msgsEl.scrollHeight;
  });
  document.getElementById('msgInput').focus();
}

async function sendMessage(){
  const text=document.getElementById('msgInput').value.trim();
  if(!text||!activePeer)return;
  const mySnap=await currentUserRef.child('status').get();
  if(mySnap.val()!=='active'){toast('Account not active','error');return;}
  await db.ref('chats/'+activeChatId+'/messages').push({sender:currentUser,text:encodeMsg(text),timestamp:firebase.database.ServerValue.TIMESTAMP});
  document.getElementById('msgInput').value='';
  document.getElementById('msgInput').focus();
}
document.getElementById('sendBtn').onclick=sendMessage;
document.getElementById('msgInput').addEventListener('keypress',e=>{if(e.key==='Enter'){e.preventDefault();sendMessage();}});
document.getElementById('backBtn').onclick=()=>{document.getElementById('sidebar').classList.remove('hide-mobile');document.getElementById('chatArea').classList.add('hide-mobile');};

// PROFILE PIC UPLOAD
document.getElementById('profilePicInput').onchange=async(e)=>{
  const file=e.target.files[0];
  if(!file)return;
  if(file.size>2000000){toast('Image too large (max 2MB)','error');return;}
  const reader=new FileReader();
  reader.onload=()=>{openCropModal(reader.result);};
  reader.readAsDataURL(file);
  e.target.value='';
};

function openCropModal(imgSrc){
  const card=document.getElementById('modalCard');
  card.innerHTML=`<div class="mc-head"><div class="mc-icon info"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div><div><div class="mc-title">Crop Profile Picture</div><div class="mc-subtitle">Drag to position</div></div></div><div class="mc-body" style="text-align:center"><div style="position:relative;width:240px;height:240px;margin:0 auto;overflow:hidden;border-radius:50%;background:#000" id="cropContainer"><img id="cropImg" src="${imgSrc}" style="max-width:none;position:absolute;cursor:move" /></div><input type="range" id="cropZoom" min="50" max="200" value="100" style="width:100%;margin-top:16px" /></div><div class="mc-actions"><button class="btn btn-ghost" id="cropCancel">Cancel</button><button class="btn btn-primary" id="cropSave">Save</button></div>`;
  document.getElementById('modalOverlay').classList.add('active');
  const img=document.getElementById('cropImg');
  const container=document.getElementById('cropContainer');
  let scale=1;
  let posX=0,posY=0;
  let isDragging=false,dragStartX=0,dragStartY=0;
  img.onload=()=>{
    const ratio=Math.max(container.offsetWidth/img.offsetWidth,container.offsetHeight/img.offsetHeight);
    scale=ratio;
    img.style.width=(img.offsetWidth*scale)+'px';
    img.style.height=(img.offsetHeight*scale)+'px';
    posX=(container.offsetWidth-img.offsetWidth*scale)/2;
    posY=(container.offsetHeight-img.offsetHeight*scale)/2;
    img.style.left=posX+'px';
    img.style.top=posY+'px';
  };
  img.addEventListener('mousedown',e=>{isDragging=true;dragStartX=e.clientX-posX;dragStartY=e.clientY-posY;e.preventDefault();});
  document.addEventListener('mousemove',e=>{if(!isDragging)return;posX=e.clientX-dragStartX;posY=e.clientY-dragStartY;img.style.left=posX+'px';img.style.top=posY+'px';});
  document.addEventListener('mouseup',()=>{isDragging=false;});
  img.addEventListener('touchstart',e=>{isDragging=true;const t=e.touches[0];dragStartX=t.clientX-posX;dragStartY=t.clientY-posY;e.preventDefault();});
  document.addEventListener('touchmove',e=>{if(!isDragging)return;const t=e.touches[0];posX=t.clientX-dragStartX;posY=t.clientY-dragStartY;img.style.left=posX+'px';img.style.top=posY+'px';e.preventDefault();});
  document.addEventListener('touchend',()=>{isDragging=false;});
  document.getElementById('cropZoom').oninput=function(){
    const newScale=parseFloat(this.value)/100*scale;
    img.style.width=(img.offsetWidth*scale*parseFloat(this.value)/100)+'px';
  };
  document.getElementById('cropCancel').onclick=closeModal;
  document.getElementById('cropSave').onclick=async()=>{
    const canvas=document.createElement('canvas');
    canvas.width=256;canvas.height=256;
    const ctx=canvas.getContext('2d');
    const imgEl=document.getElementById('cropImg');
    const cw=container.offsetWidth,ch=container.offsetHeight;
    const sx=(-parseFloat(imgEl.style.left||0))*(imgEl.naturalWidth/parseFloat(imgEl.style.width||imgEl.naturalWidth));
    const sy=(-parseFloat(imgEl.style.top||0))*(imgEl.naturalHeight/parseFloat(imgEl.style.height||imgEl.naturalHeight));
    const sw=cw*(imgEl.naturalWidth/parseFloat(imgEl.style.width||imgEl.naturalWidth));
    const sh=ch*(imgEl.naturalHeight/parseFloat(imgEl.style.height||imgEl.naturalHeight));
    ctx.drawImage(imgEl,sx,sy,sw,sh,0,0,256,256);
    const dataUrl=canvas.toDataURL('image/jpeg',0.8);
    await currentUserRef.child('profilePic').set(dataUrl);
    closeModal();
    toast('Profile picture updated','success');
  };
}

// CHANGE USERNAME (verified only)
function openChangeUsername(){
  openModal({
    icon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>',
    iconClass:'info',title:'Change Username',subtitle:'Verified accounts only',
    bodyHtml:`<div class="field"><label>New username</label><input type="text" id="newUsername" placeholder="Enter new username" autocomplete="off" /><div class="err" id="newUsernameErr"></div></div>`,
    actions:[{label:'Cancel',class:'btn-ghost',onClick:closeModal},{label:'Change',class:'btn-primary',onClick:async()=>{
      const nu=sanitizeUsername(document.getElementById('newUsername').value);
      const e=document.getElementById('newUsernameErr');e.textContent='';
      if(nu.length<3){e.textContent='At least 3 characters';return;}
      if(nu===currentUser){e.textContent='Same as current username';return;}
      const snap=await db.ref('users/'+nu).get();
      if(snap.exists()){e.textContent='Username already taken';return;}
      // Create new user node with same data
      const oldData=(await db.ref('users/'+currentUser).get()).val();
      const newData={...oldData,username:nu};
      await db.ref('users/'+nu).set(newData);
      await db.ref('mobileIndex/'+oldData.mobile).set(nu);
      // Update chat references
      if(oldData.chats){
        for(const peer of Object.keys(oldData.chats)){
          const cid=chatIdFor(currentUser,peer);
          const newCid=chatIdFor(nu,peer);
          const chatSnap=await db.ref('chats/'+cid).get();
          if(chatSnap.exists()){
            await db.ref('chats/'+newCid).set(chatSnap.val());
            await db.ref('chats/'+cid).remove();
          }
          await db.ref('users/'+peer+'/chats/'+nu).set({cid:newCid,peer:nu,...(oldData.chats[peer]||{})});
          await db.ref('users/'+peer+'/chats/'+currentUser).remove();
        }
      }
      await db.ref('users/'+currentUser).remove();
      localStorage.setItem('indochat_user',nu);
      closeModal();
      toast('Username changed. Please sign in again.','success');
      setTimeout(()=>location.reload(),1500);
    }}]
  });
}

// MY CASES (verified users see their live report status)
async function openMyCases(){
  const snap=await db.ref('teamRequests').get();
  const cases=[];
  if(snap.exists()){
    snap.forEach(c=>{
      const r=c.val();
      if((r.type==='live_report'||r.type==='user_report')&&r.reporter===currentUser){
        cases.push({id:c.key,...r});
      }
    });
  }
  cases.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  let html='';
  if(cases.length===0){
    html='<div style="text-align:center;color:var(--text-2);padding:30px;font-size:13px">No report cases yet.</div>';
  }else{
    html='<div style="display:flex;flex-direction:column;gap:10px">'+cases.map(c=>{
      const statusColor=c.status==='pending'?'var(--warn)':c.status==='approved'?'var(--ok)':'var(--danger)';
      const statusText=c.status==='pending'?'Under Review':c.status==='approved'?'Resolved':'Dismissed';
      const actionText=c.resolutionNote?('Action: '+escapeHtml(c.resolutionNote)):'No action yet';
      return '<div style="background:var(--bg-3);border:1px solid var(--border);border-radius:10px;padding:12px"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="font-weight:600;font-size:13px">'+escapeHtml(c.reportType||c.reason||'Report')+'</span><span style="font-size:10px;color:'+statusColor+';font-weight:600;text-transform:uppercase">'+statusText+'</span></div><div style="font-size:11px;color:var(--text-2);margin-bottom:4px">'+escapeHtml((c.details||c.reason||'').slice(0,80))+'</div><div style="font-size:11px;color:var(--text-3)">'+actionText+'</div>'+(c.reportedUser?'<div style="font-size:11px;color:var(--text-3);margin-top:2px">Against: '+escapeHtml(c.reportedUser)+'</div>':'')+'</div>';
    }).join('')+'</div>';
  }
  openModal({
    icon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-4"/><polyline points="9 11 12 14 15 11"/></svg>',
    iconClass:'info',title:'My Report Cases',subtitle:cases.length+' case(s)',
    bodyHtml:html,
    actions:[{label:'Close',class:'btn-ghost',onClick:closeModal}]
  });
}

// AI REVIEW (client-side simulation - analyzes report and chat)
async function triggerAIReview(reportId){
  const reportSnap=await db.ref('teamRequests/'+reportId).get();
  const report=reportSnap.val();
  if(!report)return;
  // Fetch chat history between reporter and reported user
  const cid=chatIdFor(report.reporter,report.reportedUser);
  const msgSnap=await db.ref('chats/'+cid+'/messages').orderByKey().limitToLast(50).get();
  const messages=[];
  msgSnap.forEach(c=>{const m=c.val();messages.push({sender:m.sender,text:decodeMsg(m.text||''),timestamp:m.timestamp});});
  // AI analysis - check for violation patterns
  const violation=analyzeWithAI(report,messages);
  if(violation.confirmed){
    // Auto-suspend the reported user
    const caseId='AI-'+Date.now().toString(36).toUpperCase().slice(-6);
    await db.ref('users/'+report.reportedUser).update({
      status:'suspended',
      suspensionInfo:{
        reason:'AI-detected: '+violation.reason+' (auto-suspended based on report)',
        timestamp:firebase.database.ServerValue.TIMESTAMP,
        caseId:caseId,
        suspendedBy:'IndoChat AI',
        autoSuspended:true,
        reportId:reportId
      },
      'appeal/submitted':false,
      'appeal/captchaPassed':false,
      'appeal/faceVerification':{left:false,right:false,up:false,down:false},
      'appeal/faceSnapshots':null
    });
    await db.ref('teamRequests/'+reportId).update({
      status:'approved',
      aiAnalysis:violation,
      resolvedAt:firebase.database.ServerValue.TIMESTAMP,
      resolvedBy:'IndoChat AI',
      resolutionNote:'Auto-suspended: '+violation.reason
    });
  }else{
    await db.ref('teamRequests/'+reportId).update({
      aiAnalysis:violation,
      status:'pending',
      aiReviewed:true
    });
  }
}

// AI ANALYSIS - checks for violations
function analyzeWithAI(report,messages){
  const result={confirmed:false,reason:'',confidence:0,flags:[]};
  const reportReason=(report.reason||'').toLowerCase();
  const details=(report.details||'').toLowerCase();
  // Flag patterns - keywords that indicate violations
  const abuseWords=['stupid','idiot','hate','kill','die','threat','abuse','harass'];
  const hateWords=['racist','slur','discriminate'];
  const spamPatterns=['buy now','click here','free money','earn money','subscribe','follow me'];
  let score=0;
  // Analyze chat messages
  messages.forEach(m=>{
    const text=(m.text||'').toLowerCase();
    abuseWords.forEach(w=>{if(text.includes(w)){score+=15;result.flags.push('Abusive language: "'+w+'"');}});
    hateWords.forEach(w=>{if(text.includes(w)){score+=25;result.flags.push('Hate speech: "'+w+'"');}});
    spamPatterns.forEach(p=>{if(text.includes(p)){score+=20;result.flags.push('Spam pattern: "'+p+'"');}});
  });
  // Analyze report reason
  if(reportReason==='spam'||reportReason==='abuse'||reportReason==='threats'||reportReason==='hate'){
    score+=30;
  }
  if(details.length>50){score+=10;}
  // Multiple reports increase confidence
  result.confidence=Math.min(100,score);
  if(score>=50){
    result.confirmed=true;
    result.reason=result.flags[0]||report.reason;
  }
  return result;
}

// APPEAL
let appealCaptcha='',appealStep=0;
let faceStream=null,faceSteps=['left','right','up','down'],faceStepIndex=0,faceBaseline=null,faceMonitor=null,faceModelsLoaded=false,holdMs=0;
const HOLD_REQ=1500;

function startAppeal(){appealStep=0;renderAppeal();}
function renderAppeal(){
  const card=document.getElementById('mainOverlayCard');
  if(appealStep===0){
    appealCaptcha=genCaptcha();
    card.innerHTML=`<div class="ig-screen"><div class="ig-icon info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div><div class="ig-title">Verification</div><div class="ig-desc">Step 1 - Captcha</div><div style="background:var(--bg-3);border-radius:12px;padding:16px;margin-bottom:16px"><div class="captcha-canvas">${appealCaptcha.split('').map(c=>'<span>'+c+'</span>').join('')}</div><input type="text" id="captchaInput" maxlength="6" placeholder="Enter captcha" style="width:100%;padding:11px;background:var(--bg-2);border:1px solid var(--border);border-radius:8px;color:var(--text);text-align:center;letter-spacing:4px;font-weight:600;text-transform:uppercase;font-family:monospace;outline:none" /><div class="err" id="captchaErr" style="color:var(--danger);font-size:11px;margin-top:4px"></div></div><div class="ig-actions"><button class="btn btn-primary" id="verifyCaptchaBtn">Continue</button><button class="btn btn-ghost" id="cancelAppeal">Cancel</button></div></div>`;
    document.getElementById('captchaInput').focus();
    document.getElementById('verifyCaptchaBtn').onclick=verifyCaptcha;
    document.getElementById('cancelAppeal').onclick=()=>{stopCamera();showSuspension();};
  }else if(appealStep===1){
    card.innerHTML=`<div class="ig-screen"><div class="ig-icon info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></div><div class="ig-title">Face Verification</div><div class="ig-desc">Look in each direction. Auto-captures after 1.5s hold.</div><div class="info-banner">AI face detection active. Hold the correct direction to auto-capture.</div><div class="face-wrap" id="faceWrap"><video id="faceVideo" autoplay playsinline muted></video><canvas class="face-overlay" id="faceCanvas"></canvas><div class="face-flash" id="faceFlash"></div><div class="face-loading" id="faceLoading"><div class="spinner"></div><div id="loadingText">Loading AI...</div></div></div><div class="dir-arrow" id="dirArrow"></div><div class="dir-text" id="dirText"></div><div class="dir-steps" id="dirSteps"></div><div class="auto-bar"><div class="auto-fill" id="autoFill"></div></div><div class="motion-status" id="motionStatus">Initializing...</div><button class="btn btn-ghost" id="cancelFace" style="margin-top:12px">Cancel</button></div>`;
    renderDir();
    startCamera();
    document.getElementById('cancelFace').onclick=()=>{stopCamera();showSuspension();};
  }
}
function genCaptcha(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=c.charAt(Math.floor(Math.random()*c.length));return s;}
function verifyCaptcha(){
  const input=document.getElementById('captchaInput').value.toUpperCase().trim();
  const e=document.getElementById('captchaErr');
  if(input===appealCaptcha){appealStep=1;renderAppeal();}
  else{e.textContent='Incorrect. Try again.';appealCaptcha=genCaptcha();document.querySelector('.captcha-canvas').innerHTML=appealCaptcha.split('').map(c=>'<span>'+c+'</span>').join('');document.getElementById('captchaInput').value='';document.getElementById('captchaInput').focus();}
}
function renderDir(){
  const icons={left:'\u2190',right:'\u2192',up:'\u2191',down:'\u2193'};
  const wrap=document.getElementById('dirSteps');
  if(!wrap)return;
  wrap.innerHTML=faceSteps.map((s,i)=>{let cls='';if(i<faceStepIndex)cls='done';else if(i===faceStepIndex)cls='active';return '<div class="dir-step '+cls+'">'+icons[s]+'</div>';}).join('');
  if(document.getElementById('dirArrow'))document.getElementById('dirArrow').textContent=icons[faceSteps[faceStepIndex]];
  if(document.getElementById('dirText'))document.getElementById('dirText').textContent='Look '+faceSteps[faceStepIndex].toUpperCase();
}
async function loadFaceModels(){if(faceModelsLoaded)return;await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights');faceModelsLoaded=true;}
async function startCamera(){
  holdMs=0;faceBaseline=null;
  const loading=document.getElementById('faceLoading'),lt=document.getElementById('loadingText'),st=document.getElementById('motionStatus');
  try{
    if(lt)lt.textContent='Loading AI models...';
    if(st)st.textContent='Loading AI...';
    await loadFaceModels();
    if(lt)lt.textContent='Requesting camera...';
    if(st)st.textContent='Requesting camera...';
    faceStream=await navigator.mediaDevices.getUserMedia({video:{width:320,height:240,facingMode:'user'}});
    const v=document.getElementById('faceVideo');
    v.srcObject=faceStream;
    v.addEventListener('loadedmetadata',()=>{if(loading)loading.style.display='none';if(st)st.textContent='Detecting face...';faceMonitor=setInterval(trackFace,200);},{once:true});
  }catch(e){if(loading)loading.innerHTML='<div style="color:var(--danger);font-size:12px;padding:16px;text-align:center">'+escapeHtml(e.message)+'<br/><br/><button class="btn btn-ghost" style="padding:8px 16px" onclick="startCamera()">Retry</button></div>';if(st)st.textContent='Error';}
}
async function trackFace(){
  if(!faceStream||!faceModelsLoaded)return;
  const v=document.getElementById('faceVideo');
  if(!v||!v.videoWidth)return;
  try{
    const d=await faceapi.detectSingleFace(v,new faceapi.TinyFaceDetectorOptions({inputSize:224,scoreThreshold:0.5}));
    const st=document.getElementById('motionStatus'),fill=document.getElementById('autoFill');
    if(!d){if(st){st.textContent='No face detected';st.className='motion-status error';}if(fill)fill.style.width='0%';holdMs=0;faceBaseline=null;const c=document.getElementById('faceCanvas');if(c)c.getContext('2d').clearRect(0,0,c.width,c.height);return;}
    const box=d.box,cx=box.x+box.width/2,cy=box.y+box.height/2;
    drawBox(box);
    if(!faceBaseline){faceBaseline={x:cx,y:cy};if(st){st.textContent='Face detected. Look '+faceSteps[faceStepIndex].toUpperCase();st.className='motion-status ready';}holdMs=0;return;}
    const dx=cx-faceBaseline.x,dy=cy-faceBaseline.y,T=25,req=faceSteps[faceStepIndex];
    let dir=null;
    if(Math.abs(dx)>Math.abs(dy)){if(dx>T)dir='left';else if(dx<-T)dir='right';}
    else{if(dy<-T)dir='up';else if(dy>T)dir='down';}
    if(dir===req){holdMs+=200;const pct=Math.min(100,Math.round(holdMs/HOLD_REQ*100));if(fill){fill.style.width=pct+'%';if(pct>=100)fill.classList.add('complete');else fill.classList.remove('complete');}const r=Math.max(0,Math.ceil((HOLD_REQ-holdMs)/1000));if(st){st.textContent=r>0?'Hold... '+r+'s':'Capturing...';st.className='motion-status ready';}if(holdMs>=HOLD_REQ)autoCapture();}
    else{holdMs=0;if(fill){fill.style.width='0%';fill.classList.remove('complete');}if(dir){if(st){st.textContent='Wrong: '+dir.toUpperCase()+'. Look '+req.toUpperCase()+'.';st.className='motion-status wrong';}}else{if(st){st.textContent='Look '+req.toUpperCase()+' and hold.';st.className='motion-status';}}}
  }catch(e){}
}
function drawBox(box){
  const c=document.getElementById('faceCanvas');if(!c)return;const v=document.getElementById('faceVideo');if(!v||!v.videoWidth)return;
  if(c.width!==v.clientWidth||c.height!==v.clientHeight){c.width=v.clientWidth;c.height=v.clientHeight;}
  const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);
  const sx=c.width/v.videoWidth,sy=c.height/v.videoHeight;
  const x=(v.videoWidth-box.x-box.width)*sx,y=box.y*sy,w=box.width*sx,h=box.height*sy,cl=Math.min(w,h)*0.2;
  ctx.strokeStyle='#0095f6';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();
  ctx.moveTo(x,y+cl);ctx.lineTo(x,y);ctx.lineTo(x+cl,y);
  ctx.moveTo(x+w-cl,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w,y+cl);
  ctx.moveTo(x+w,y+h-cl);ctx.lineTo(x+w,y+h);ctx.lineTo(x+w-cl,y+h);
  ctx.moveTo(x+cl,y+h);ctx.lineTo(x,y+h);ctx.lineTo(x,y+h-cl);
  ctx.stroke();
}
function autoCapture(){
  const v=document.getElementById('faceVideo');if(!v||!v.srcObject)return;
  const c=document.createElement('canvas');c.width=280;c.height=280;const ctx=c.getContext('2d');
  ctx.translate(c.width,0);ctx.scale(-1,1);ctx.drawImage(v,0,0,c.width,c.height);
  const url=c.toDataURL('image/jpeg',0.7);
  const dir=faceSteps[faceStepIndex];
  currentUserRef.child('appeal/faceVerification/'+dir).set(true);
  currentUserRef.child('appeal/faceSnapshots/'+dir).set(url);
  const flash=document.getElementById('faceFlash');if(flash){flash.classList.add('flashing');setTimeout(()=>flash.classList.remove('flashing'),500);}
  toast('Captured: '+dir,'success');
  faceBaseline=null;holdMs=0;
  const fill=document.getElementById('autoFill');if(fill){fill.style.width='0%';fill.classList.remove('complete');}
  const st=document.getElementById('motionStatus');if(st){st.textContent='Next direction...';st.className='motion-status';}
  faceStepIndex++;
  if(faceStepIndex>=faceSteps.length)finishAppeal();
  else renderDir();
}
function stopCamera(){if(faceMonitor){clearInterval(faceMonitor);faceMonitor=null;}if(faceStream){faceStream.getTracks().forEach(t=>t.stop());faceStream=null;}faceBaseline=null;holdMs=0;}
async function finishAppeal(){stopCamera();await currentUserRef.child('appeal').update({submitted:true,captchaPassed:true,submittedAt:firebase.database.ServerValue.TIMESTAMP});showSuspension();toast('Appeal submitted','success');}
